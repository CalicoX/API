<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>17TRACK API — One Solution, Various Use Cases</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --fg: rgba(255, 255, 255, 0.92);
        --dim: rgba(255, 255, 255, 0.42);
        --faint: rgba(255, 255, 255, 0.14);
        --accent: #ff8300;
        --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
      }

      html,
      body {
        background: #0b0b0d;
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px
        );
        background-size: 26px 26px;
      }

      .spacer {
        height: 300vh;
      }

      #gl {
        position: fixed;
        inset: 0;
        z-index: 1;
      }

      #gl canvas {
        display: block;
      }

      .hud {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .hud::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 45%,
          transparent 60%,
          rgba(0, 0, 0, 0.45) 100%
        );
      }

      header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 40px;
        z-index: 4;
      }

      .brand-logo {
        height: 20px;
        width: auto;
        display: block;
      }

      nav {
        display: flex;
        gap: 28px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--dim);
      }

      .cta {
        pointer-events: auto;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #0b0b0d;
        background: var(--fg);
        border: none;
        padding: 10px 18px;
        cursor: pointer;
      }

      .cta:hover {
        background: var(--accent);
        color: #fff;
      }

      .copy {
        position: absolute;
        left: 56px;
        bottom: 96px;
        z-index: 4;
        max-width: 340px;
      }

      h1 {
        font-size: clamp(24px, 2.6vw, 34px);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      h1 em {
        font-style: normal;
        color: var(--accent);
      }

      .points {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .point {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12.5px;
        color: var(--dim);
      }

      .point .check {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(125, 211, 252, 0.15);
        color: #7dd3fc;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 40px;
        z-index: 4;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--dim);
      }

      .progress {
        position: relative;
        flex: 1;
        height: 1px;
        background: var(--faint);
        margin: 0 28px;
      }

      .progress i {
        position: absolute;
        left: 0;
        top: -1px;
        height: 3px;
        width: 0%;
        background: var(--accent);
      }

      .scroll-hint {
        animation: bob 1.8s ease-in-out infinite;
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(4px); }
      }

      @media (max-width: 800px) {
        .copy { left: 24px; right: 24px; max-width: none; }
        nav { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="spacer"></div>

    <div id="gl"></div>

    <div class="hud">
      <header>
        <img class="brand-logo" src="../public/assets/logo-17track-white.svg" alt="17TRACK" />
        <nav>
          <span>API</span><span>DOCS</span><span>PRICING</span>
        </nav>
        <button class="cta">GET STARTED ↗</button>
      </header>

      <div class="copy">
        <h1>One Solution,<br /><em>Various</em> Use Cases.</h1>
        <div class="points">
          <div class="point">
            <span class="check">✓</span>
            Track and trace your shipments in bulk.
          </div>
          <div class="point">
            <span class="check">✓</span>
            Build a tracking portal in your own system.
          </div>
          <div class="point">
            <span class="check">✓</span>
            Avoid high cost of multi-carrier integration.
          </div>
        </div>
      </div>

      <div class="bottom">
        <span>17TRACK API v2.4</span>
        <div class="progress"><i id="progress-fill"></i></div>
        <span class="scroll-hint">SCROLL TO EXPLODE ↓</span>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./exploded.js"></script>
  </body>
</html>
