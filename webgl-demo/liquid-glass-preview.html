<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Hub — Preview</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #16171a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      #host {
        position: fixed; inset: 0;
      }
      .overlay {
        position: fixed; top: 0; left: 0; width: 100%;
        pointer-events: none; z-index: 10;
      }
      .title { padding: 40px 48px; color: #fff; }
      .title h1 { font-size: 28px; font-weight: 600; letter-spacing: 0.05em; opacity: 0.95; }
      .title p { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,0.45); }
      .hint {
        position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
        font-size: 12px; color: rgba(255,255,255,0.35); letter-spacing: 0.08em;
        pointer-events: none; z-index: 10; user-select: none;
      }
      .progress-bar {
        position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
        width: 220px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px;
        z-index: 10; overflow: hidden;
      }
      .progress-fill {
        height: 100%; background: #7dd3fc; border-radius: 2px; width: 0%;
        transition: width 0.1s linear;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="title">
        <h1>Liquid Glass Hub</h1>
        <p>移动鼠标驱动透镜 · 滚动改变进度 · 终端打字机实时运行</p>
      </div>
    </div>
    <div class="hint">LIQUID GLASS LENS — PRISM BEAM — FILM GRAIN</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="host"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import { createLiquidGlassHub } from "../src/fx/modules/liquid-glass-hub.js";

      const host = document.getElementById("host");
      const fill = document.getElementById("progressFill");
      const hub = createLiquidGlassHub(host, {
        assetBase: "/assets/webgl-hub",
        onReady: () => console.log("liquid glass hub ready"),
      });

      // real wheel-driven progress
      let p = 0.15;
      const fillUpdate = () => { fill.style.width = (p * 100) + "%"; };
      fillUpdate();

      window.addEventListener("wheel", (e) => {
        e.preventDefault();
        p = Math.max(0, Math.min(1, p + e.deltaY * 0.0006));
        hub.setProgress(p);
        fillUpdate();
        console.log("[preview] wheel p =", p.toFixed(3));
      }, { passive: false });
    </script>
  </body>
</html>
